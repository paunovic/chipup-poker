message FetchHandHistoryReply {
	repeated ClubHandHistoryReply reply = 1;
}
message ClubHandHistoryReply {
	required bytes clubid = 1;
	required bytes gameid = 2;
	repeated HandHistory rows = 3;
	repeated GameEventHistory events = 4;
}
message GameEventHistory {
	enum GameEventType {
		geCashin = 1;
		geCashout = 2;
		geOpened = 3;
	}
	required GameEventType eventtype = 1;
	required uint32 timestamp = 2;
	optional bytes userid = 3;
	optional int32 change = 4;
}
message HandHistory {
	message PlayerHandHistory {
		required bytes _id = 1;
		required uint32 seat = 2;
		repeated bytes cards = 3;
	}
	required bytes _id = 1;
	required uint32 seq = 2;
	required uint32 totalrake = 3;
	repeated PlayerHandHistory players = 4;
	required bytes tablecards = 5;
	required uint32 endtime = 6;
	repeated int32 balance_changes = 7;
}