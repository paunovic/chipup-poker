package Poker;

option optimize_for = LITE_RUNTIME;

import "common.proto";

message StringSizes {
	required int32 email = 1;
	required int32 password = 2;
	required int32 clubname = 3;
	required int32 invcode = 4;
	required int32 username = 5;
	required int32 gamename = 6;
}

message HelloReply {
	required StringSizes stringSizes = 2;
	required int32 ChangeExpireTime = 3;
	required int32 ForgotExpireTime = 4;
	required int32 max_play_time = 5;
	required int32 max_timebank = 6 [ default = 60000 ];
}

message LoginParams {
	required string username = 1;
	required string password = 2;
}

message RegisterParams {
	required string email = 1;
	required string password = 2;
	required string displayName = 3;
}

message ForgotPasswordParams {
	required string email = 1;
}

message LoginReply {
	enum LoginStatus {
		lrSuccess = 0;
		lrInvalid = 1;
	}
	required LoginStatus status = 1;
}

message Club {
	optional bytes _id = 1;
	optional uint32 chips = 2;
	optional string name = 4;
	optional bytes owner = 5;
	optional string password = 6;
	optional bool is_private = 7;
	optional int32 seq = 8;
	repeated bytes members = 9;
	optional bool has_password = 10;
	optional int32 member_count = 11;
	repeated bytes suspended_members = 12;
	optional int32 rake = 13;
}

message User {
	required bytes _id = 1;
	optional bytes avatar = 2;
	required string displayname = 3;
	
	optional string email = 5;
	optional bool authed = 6;
	optional uint32 chips = 7;
}

message Game {
	enum GameLimit {
		glNoLimit = 0;
		glPotLimit = 1;
		glFixedLimit = 2;
	}
	enum GameType {
		gtHoldem = 0;
		gtOmaha = 1;
	}
	optional bytes _id = 1;
	optional bytes creator_mongo_id = 2;
	optional string gamename = 3;
	optional int32 clubseq = 4;
	optional GameType game_type = 5;
	optional GameLimit game_limit = 6;
	optional int32 small_blind = 7;
	optional int32 big_blind = 8;
	optional int32 seats = 9;
	optional int32 sitting = 10;
	optional int32 buyin_min = 11;
	optional int32 buyin_max = 12;
}

message StatusReply {
	repeated Club clubs = 1;
	repeated User users = 2;
	required User self = 3;
	repeated Game games = 4;
}

message GetDeckReply {
	required string deck = 1;
}

message ListClubsReply {
	repeated Club clubs = 1;
}

message KickPlayerParams {
	required int32 club_seq = 1;
	required bytes player_mongo_id = 2;
}

message GiveClubOwnershipParams {
	required int32 club_seq = 1;
	required bytes player_mongo_id = 2;
}

message TransferChipsParams {
	required bytes player_mongo_id = 2;
	required int32 chip_amount = 3;
}

message ChangeEMailParams {
	required string new_mail = 1;
}

message ChangePasswordParams {
	required string new_password = 1;
}

message SetAvatarParams {
	required bytes avatar_id = 1;
}
message SetAvatarReply {
	enum SetAvatarStatus {
		saSuccess = 1;
		saNotFound = 2;
	}
	required SetAvatarStatus status = 1;
}

message ChatEvent {
	enum EventType {
		ceUserMessage = 0;
		ceServerMessage = 1;
	}
	required EventType event = 1;
	required ChatMessage msg = 2;
	optional bytes table_id = 3;
}

message ChatMessage {
	optional bytes _id = 1;
	optional string username = 2;
	required string msg = 3;
	optional int64 timestamp = 4;
}

enum ServerCodes {
	srNotImplemented = 0;
	srHello = 1;
	srLoginReply = 2;
	srRegisterReply = 3;
	srCreateClubReply = 4;
	srJoinClubReply = 5;
	srLeaveClubReply = 6;
	srChangeClubDetailsReply = 7;
	srLogout = 8;
	srListClubs = 9;
	srStatus = 10;
	srKickPlayerReply = 11;
	srSetAvatarReply = 12;
	srChangeMailReply = 13;
	srGetPlayers = 14;
	srTableSitNoChips = 15;

    srOwnershipGiveAwayNotOwner = 24;
    srOwnershipGiveAwayInvalidPlayerId = 25;
    srOwnershipGiveAwayInvalidClubId = 26;
    srOwnershipGiveAwayOk = 27;

    srClubDisbandOk = 30;
	
    srTransferChipsOk = 31;
	srTransferChipsInvalidAmount = 32;

    srChangePasswordOk = 38;

    srCreateGameOk = 42;
    srDeleteGameOk = 43;
    srEditGameOk = 44;
    srTableSitOk = 45;
    srTableSitSeatTaken = 46;
    srTableStandUpOk = 47;
	srPong = 48;
    srSuspendPlayerOk = 49;
    srReinstatePlayerOk = 50;
	srTableAddonOk = 51;
	srTableAddonOverLimit = 52;

    seChat = 200;
    seSecondaryLoginDetected = 201;
    seAccountConfirmed = 202;
    seClubChange = 203;
    seClubDeleted = 204;
	seGameChange = 205;
	seGameCreate = 206;
	seGameDelete = 207;

	seTableStatus = 209;
	seTransferChips = 210;

    scLogin = 501;
    scStatus = 502;
    scRegister = 503;
    scForgotPassword = 504;
    scLogout = 505;
    scListPublicClubs = 506;
    scCreateClub = 507;
    scJoinClub = 508;
    scKickPlayer = 509;
    scLeaveClub = 510;
    scGiveClubOwnership = 511;
    scChangeClubDetails = 512;
    scDeleteClub = 513;
    scTransferChips = 514;
    scChangeEmail = 515;
    scChangePassword = 516;
    scSetAvatar = 517;
    scCreateGame = 518;
    scDeleteGame = 519;
    scEditGame = 520;
    scTableJoin = 521;
    scTableLeave = 522;
    scTableSit = 523;
    scTableStandUp = 524;
	scPing = 525;
    scSuspendPlayer = 526;
    scGetPlayers = 527;
	scFold = 528;
	scPutChips = 529;
	scTableAddOn = 530;
	scTablePlayNow = 531;
	scTableSitOut = 532;
	scTableSitOutNextBB = 533;
}

service Server {
	rpc Login (LoginParams) returns (LoginReply);
}

message PingParams {
	required uint32 uptime = 1;
}

message PingReply {
	required uint32 uptime = 1;
	required uint64 servertime = 2;
}

message TableSit {
	required bytes game_id = 1;
	optional int32 seat_index = 2;
	required uint32 chips = 3;
}

message TableStatus {
	enum TableState {
		tsIdle = 1;
		tsPreFlop = 2;
		tsFlop = 3;
		tsTurn = 4;
		tsRiver = 5;
		tsWinning = 6;
		tsWinning2 = 7;
	}
	
	required bytes table_mongo_id = 1;
	repeated SeatInfo seats = 2;
	required TableState state = 3;
	required int32 dealer = 4;
	required int32 current_seat = 5;
	repeated uint32 bets = 6;
	optional bytes flop = 7;
	optional bytes turn = 8;
	optional bytes river = 9;
	repeated uint32 pots = 10;
	required bool locked = 11;
	optional int32 seq = 12;
	optional uint32 minimum_bet = 13;
	optional uint32 maximum_limit = 14;
	optional int32 small_blind = 15;
	optional int32 big_blind = 16;
	optional uint32 handid = 17;
	optional uint64 time = 18;
	repeated TableEvent events = 19;
}

message SeatInfo {
	enum PlayerStatus {
		psOutOfPlay = 1;
		psOutOfHand = 2;
		psInHand = 3;
		psFolded = 4;
		psAllIn = 5;
		psStandingUp = 6;
	}
	required int32 seat = 1;
	required bytes player_mongo_id = 2;
	required uint32 chips = 3;
	optional int32 card_count = 4;
	optional bytes cards = 5;
	required PlayerStatus status = 6;
	required uint32 timebank = 7;
}
message ChangeSuspendState {
	required bytes club_mongo_id = 1;
	required bytes player_mongo_id = 3;
	required bool suspended = 2;
}
message RegisterReply {
	enum RegisterStatus {
		regSuccess = 0;
		regDuplicateEmail = 1;
		regDupUsername = 2;
		regInvalidEmail = 3;
		regInvalidName = 4;
	}
	required RegisterStatus status = 1;
}
message ClubCommandReply {
	enum ClubStatus {
		csSuccess = 0;
		csInvalidName = 1;
		csInvalidPassword = 2;
		csNameExists = 3;
		csInvalidClubId = 4;
		csAlreadyMember = 5;
		csBadPassword = 6;
		csInvalidPlayerId = 7;
	}
	required ClubStatus status = 1;
	optional Club club = 2;
	repeated Game games = 3;
}
message ChangeMailReply {
	enum ChangeMailStatus {
		cmSuccess = 0;
		cmDuplicateMail = 1;
		cmInvalidEmail = 2;
	}
	required ChangeMailStatus status = 1;
}
message GetUserParams {
	repeated bytes user_mongo_ids = 1;
	repeated User users = 2;
}

message TableEvent {
	enum TableEventType {
		teFold = 1;
		teSit = 2;
		teStandUp = 3;
		teWinning = 4;
		teDealing = 5;
		teCheck = 6;
		teCall = 7;
		teRaise = 8;
		teAllIn = 9;
	}
	message WinnerData {
		enum CardRankings {
			crRoyalFlush = 1;
			crStraightFlush = 2;
			cr4OfKind = 3;
			crFullHouse = 4;
			crFlush = 5;
			crStraight = 6;
			crThreeOfKind = 7;
			crTwoPair = 8;
			crOnePair = 9;
			crHighCard = 10;
		}
		required int32 seat = 3;
		required string msg = 4;
	}
	message PotInfo {
		required uint32 sum = 1;
		repeated uint32 seats = 2;
		repeated WinnerData WinnerData = 3;
	}
	required TableEventType event = 1;
	optional int32 seat = 2;
	repeated PotInfo pots = 4;
}

message PutChips {
	required bytes table_mongo_id = 1;
	required uint32 chip_amount = 2;
}

message TableBoolFlag {
	required bytes table_mongo_id = 1;
	required bool flag = 2;
}