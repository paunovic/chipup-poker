<!doctype html>
<html class="no-js" lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ChipUp Poker | Welcome</title>
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">

    <link rel="stylesheet" href="css/foundation.css" />
    <link rel="stylesheet" href="css/style.css" />
    <link href='http://fonts.googleapis.com/css?family=Sintony:400,700&subset=latin,latin-ext' rel='stylesheet' type='text/css'>

  <body>
    
    <div class="row header">
      <div class="large-4 small-12 columns">

        <div class="large-8 small-12 columns">
         <nav id="main_menu" class="top-bar" data-topbar>
           <section class="top-bar-section">

               <li class="active"><a href="contact.html">Contact us</a></li>
             </ul>
           </section>
         </nav>

    <div class="row inner">
  		<div class="large-3 medium-12 columns"><h1 class="side_title">Contact</h1></div>
  		<div class="large-6 medium-12 small-12 columns">
			<form id="contact_form" name="input" action="/contactPost" method="post">
			<input type="text" placeholder="Name" name="name" />
			<input type="text" placeholder="E-Mail" name="email" />
			<select name="type">
				<option value="Questions">Questions</option>
				<option value="Suggestions">Suggestions</option>
				<option value="Other">Other</option>
		        </select>
		        <textarea rows="12" placeholder="Message" name="message"></textarea>
		        <input class="button" type="submit" value="Send">
	  		</form>
  		</div>
  		<div class="large-3 medium-12 small-12 columns"><img src="img/chip.png"></div>
    </div>
	<div class="row">
		<div class="large-12">
			<footer>
				
			</footer>
		</div>
	</div>


    
    <script src="js/vendor/jquery.js"></script>
    <script src="js/foundation.min.js"></script>

      $(document).foundation();
